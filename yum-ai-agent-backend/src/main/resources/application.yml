spring:
  application:
    name: yum-ai-agent
  profiles:
    active: local
  # 密钥外置（tracking-database.yaml 同款范式）：实际值在 ~/.orchestrator-secrets.yaml（仓库外），
  # 经 config.import 导入后由下方占位符解析，仓库可安全推送公仓
  config:
    import: optional:file:${user.home}/.orchestrator-secrets.yaml
  # 排除 ollama 自动装配（demo 学习面手动 new 用；避免与智谱双 ChatModel/EmbeddingModel 候选撞注入点）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
# 临时注释掉，便于大家开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    # DashScope 段（切智谱备用，见 pom 注释块）：
    # dashscope:
    #   api-key: your-api-key
    #   chat:
    #     options:
    #       model: qwen-plus
    zhipuai:
      api-key: ${orchestrator.zhipu.agentKey:}
      chat:
        options:
          model: glm-5.3-flash  # 推理资源包档（5000 万 token；GLM-4-Flash 免费档为备用）
      embedding:
        options:
          model: embedding-2
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 服务）
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
# 临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: 你的 API Key
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG